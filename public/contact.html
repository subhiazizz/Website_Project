<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kontakt zu Nova Reach Studio: Anfrage für Webentwicklung, SEO oder Social Media. Wir melden uns schnell mit klaren nächsten Schritten."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="/contact" />
    <title>Kontakt | Anfrage für Webentwicklung & SEO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Manrope:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-title-key="title_contact">
    <div class="backdrop" aria-hidden="true"></div>
    <header class="site-header">
      <a href="/" class="logo">Nova Reach Studio</a>
      <nav class="main-nav" aria-label="Main">
        <a href="/" data-nav="home" data-i18n="nav_home">Home</a>
        <a href="/about" data-nav="about" data-i18n="nav_about">About</a>
        <a href="/services" data-nav="services" data-i18n="nav_services">Services</a>
        <a href="/process" data-nav="process" data-i18n="nav_process">Process</a>
        <a href="/contact" data-nav="contact" data-i18n="nav_contact">Contact</a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Language switcher">
        <button type="button" class="lang-btn" data-lang="de">DE</button>
        <button type="button" class="lang-btn" data-lang="en">EN</button>
      </div>
    </header>

    <main>
      <section class="page-hero section">
        <p class="eyebrow" data-i18n="contact_eyebrow">Contact</p>
        <h1 data-i18n="contact_title">Tell us your vision and we will design the growth path.</h1>
      </section>

      <section class="section split-layout contact-layout">
        <div class="form-wrap">
          <form id="contact-form" novalidate>
            <label for="name" data-i18n="form_name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required minlength="2" maxlength="100" />

            <label for="email" data-i18n="form_email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />

            <label for="company" data-i18n="form_company">Company (optional)</label>
            <input id="company" name="company" type="text" autocomplete="organization" maxlength="120" />

            <label for="service" data-i18n="form_service">Service</label>
            <select id="service" name="service" required>
              <option value="" data-i18n="form_select">Please choose</option>
              <option value="webentwicklung" data-i18n="form_service_web">Web Development</option>
              <option value="seo">SEO</option>
              <option value="social-media" data-i18n="form_service_social">Social Media Management</option>
              <option value="full-service" data-i18n="form_service_full">Full Service</option>
            </select>

            <label for="message" data-i18n="form_message">Project goals</label>
            <textarea id="message" name="message" required minlength="20" maxlength="2000"></textarea>

            <input
              type="text"
              name="website"
              id="website"
              class="honeypot"
              tabindex="-1"
              autocomplete="off"
              aria-hidden="true"
            />

            <button type="submit" class="btn btn-primary" data-i18n="form_submit">Send secure request</button>
            <p id="form-status" role="status" aria-live="polite"></p>
          </form>
        </div>
        <aside class="visual-card visual-tall">
          <img
            src="https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1200&q=80"
            alt="Beratungsgespräch im Team"
            data-i18n-alt="contact_visual_alt"
            loading="lazy"
          />
          <div class="visual-overlay">
            <p class="tag" data-i18n="contact_visual_tag">Response in 24h</p>
            <h2 data-i18n="contact_visual_title">Wir melden uns schnell mit klaren nächsten Schritten.</h2>
          </div>
        </aside>
      </section>
    </main>

    <footer class="site-footer">
      <p data-i18n="footer_text">Nova Reach Studio. Built for brands that want to lead.</p>
      <nav class="legal-nav" aria-label="Legal">
        <a href="/privacy" data-i18n="footer_privacy">Datenschutz</a>
        <a href="/imprint" data-i18n="footer_imprint">Impressum</a>
      </nav>
    </footer>

    <script src="/main.js" defer></script>
  </body>
</html>
